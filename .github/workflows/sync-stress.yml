name: Extended sync schedules
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  schedules:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: stow-git
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: stow-git
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install locked dependencies
        run: ./setup.sh
      - name: Run 200 seeds with 250 operations each
        run: |
          export STOW_SYNC_SEEDS=$(python3 -c 'print(",".join(map(str, range(1, 201))))')
          export STOW_SYNC_STEPS=250
          node --import tsx --test tests/sync-schedule.test.ts
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: failure()
        with:
          name: failing-sync-schedules
          path: build/sync-failures
          retention-days: 14
